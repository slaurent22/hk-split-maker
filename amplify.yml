version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install
        - nvm use # use version specified by .nvmrc
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
